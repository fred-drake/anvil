name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.14.0, 24]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Hypa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://hypabolic.github.io/Hypa/install.sh -o /tmp/install-hypa.sh
          # The installer prefers npm when npm is on PATH, but GitHub's npm
          # script policy can leave the native Hypa package unlinked. Hide npm
          # for this invocation so the installer uses signed release assets.
          PATH=/usr/bin:/bin sh /tmp/install-hypa.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/hypa" --version || "$HOME/.local/bin/hypa" version

      - name: Install dependencies
        run: hypa -c "npm ci"

      - name: Run checks
        run: hypa -c "npm run check"

      - name: Verify npm package contents
        run: hypa -c "npm pack --dry-run"
